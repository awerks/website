{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<main class="section">
    <h1>Login</h1>
    <!-- under development -->
    <p style="margin-bottom: 2rem;">Login functionality is under development. Come back later!</p>
    <script async src="https://telegram.org/js/telegram-widget.js?7" data-telegram-login="SubtitlesGeneratorBot"
        data-size="large" data-userpic="false" data-request-access="write" data-onauth="onTelegramAuth(user)">
        </script>

    <script>
        function onTelegramAuth(user) {
            console.log("Telegram user:", user);
            fetch('/telegram-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            })
                .then(response => {
                    if (response.redirected) {
                        window.location.href = response.url;
                    } else {
                        return response.json();
                    }
                })
                .then(data => {
                    if (data && data.redirect_url) {
                        window.location.href = data.redirect_url;
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</main>

{% endblock %}
