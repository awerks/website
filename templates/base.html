<!DOCTYPE html>
<html lang="en" data-theme="">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Welcome to Captionyx - Generate subtitles easily" />
    <meta name="keywords" content="Captionyx, subtitles, video, translation, AI" />
    <meta property="og:author" content="Captionyx">
    <meta property="og:logo" content="/static/images/logo.webp">
    <meta property="og:image" content="/static/images/logo.webp">

    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- <script src="https://kit.fontawesome.com/264d021bfb.js" crossorigin="anonymous" async></script> -->
    <!-- <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin> -->

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">


    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    </noscript>

    <link rel="stylesheet" href="/static/base.css" />

    <title>{% block title %}Captionyx{% endblock %}</title>

    {% block extra_head %}{% endblock %}

    <script>
        const themeKey = 'user-theme';
        const storedTheme = localStorage.getItem(themeKey);
        const userPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme) {
            document.documentElement.setAttribute('data-theme', storedTheme);
        }
        else if (userPrefersDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }

        function updateThemeIcon() {
            const themeIcon = document.getElementById('theme-toggle-icon');
            if (!themeIcon) return;
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem(themeKey, 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem(themeKey, 'dark');
            }
            updateThemeIcon();
        }
        document.addEventListener('DOMContentLoaded', updateThemeIcon);
    </script>
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="https://captionyx.com">captionyx</a>
            </div>
            <input type="checkbox" id="nav-toggle" />
            <label for="nav-toggle" class="nav-toggle-label">
                <i class="fas fa-bars"></i>
            </label>
            <nav>
                <a href="/#features" style="margin-right: 15px;">Features</a>
                <a href="/about" style="margin-right: 15px;">About</a>
                <a href="/privacy" style="margin-right: 15px;">Privacy</a>

                {% if 'user_id' not in request.session %}
                <!-- solving subdomain issue (can't add more than one domain) -->
                <a href="/auth/login" style="margin-right: 15px;">Login</a>
                <a href="/auth/register" style="margin-right: 15px;">Register</a>
                {% else %}
                <a href="/dashboard" style="margin-right: 15px;">Dashboard</a>

                <a href="/auth/logout" style="margin-right: 15px;">Logout</a>
                {% endif %}

                <a href="#" onclick="toggleTheme()" class="theme-toggle" title="Toggle Theme">
                    <i id="theme-toggle-icon" class="fas"></i>
                </a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <div class="container footer-container">
            <p>&copy; 2025 Captionyx. &nbsp;&nbsp;
                <a href="https://github.com/awerks/captionyx" target="_blank" class="github-link">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
