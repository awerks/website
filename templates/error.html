{% extends "base.html" %}
{% block title %}Internal Server Error{% endblock %}

{% block content %}
<main style="
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center;
">
    <h1>{{ header_message }}</h1>
    <hr style="align-self: stretch; margin: 1rem 0;">
    {% for p in paragraphs %}
    <p>{{ p }}</p>
    {% endfor %}
    <p>If the problem persists, please email us at <strong><a
                href="mailto:support@captionyx.com">support@captionyx.com</a></strong></p>
</main>
{% endblock %}
