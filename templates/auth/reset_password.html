{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="/static/auth.css">
{% endblock %}

{% block content %}
<main>
    <div class="form-container">
        <h1>Reset Password</h1>
        <p>Please enter your new password below.</p>


        <form method="POST" action="{{ url_for('reset_password', token=token) }}" onsubmit="return validatePasswords()"
            style="box-shadow: none; padding: 0;">
            <div class="form-group">
                <label for="new_password">New Password <span style="color: red;">*</span></label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="new_password" name="new_password" required
                        placeholder="Enter new password" minlength="8" maxlength="30">
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password <span style="color: red;">*</span></label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirm_password" name="confirm_password" required
                        placeholder="Confirm new password" minlength="8" maxlength="30">
                </div>
                <small id="password-error" style="color: red; margin-top: 0.5rem; display: none;"></small>
            </div>
            {% if error %}
            <p style="color: red;">{{ error }}</p>
            {% endif %}
            {% if message %}
            <p style="color: green;">{{ message }}</p>
            {% endif %}
            <button type="submit" class="button">
                Reset Password
            </button>
        </form>
    </div>
</main>

<script>
    function validatePasswords() {
        const newPassword = document.getElementById('new_password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const errorMessage = document.getElementById('password-error');

        if (newPassword !== confirmPassword) {
            errorMessage.style.display = 'block';
            errorMessage.textContent = 'Passwords do not match.';
            return false;
        } else {
            errorMessage.style.display = 'none';
            return true;
        }
    }
</script>
{% endblock %}
