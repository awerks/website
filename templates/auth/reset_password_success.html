{% extends 'base.html' %}
{% block title %}Password Reset Successful{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="/static/auth.css">

{% endblock %}

{% block content %}
<main>
    <div class="form-container">
        <h1 style="margin-bottom: 2rem; padding: 1rem;">

    </div>
