    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="author" content="Captionyx">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Captionyx - Generate and Translate Subtitles on Telegram">
    <meta property="og:description"
        content="Effortlessly generate and translate subtitles for your videos with Captionyx, the Telegram bot you didn't know you needed.">
    <meta property="og:image" content="/static/images/logo.png">

    <meta property="og:site_name" content="Captionyx">
    <meta property="og:image" content="https://cdn.plyr.io/static/icons/1200x630.png">

    <link rel="stylesheet" href="/static/video_template.css">

    <link rel="preload" as="font" crossorigin="" type="font/woff2"

<body>

    <div class="grid">
        <header>
            <a href="https://captionyx.com" target="_blank">
                <h1>Captionyx</h1>
            </a>
            <p>
                Breaking Language Barriers, One Subtitle at a Time—For Everyone, Everywhere
            </p>

            <div class="call-to-action">
                <span class="button--with-count">
                    <a href="{{ captions_url }}" target="_blank" class="button js-shr">
                        <i class="fas fa-download" style="margin-right: 6px"></i>
                        Download subtitles
                    </a>
                </span>

                <span class="button--with-count support-us">
                    <a href="https://buymeacoffee.com/subtitlesgeneratorbot" target="_blank" class="button js-shr">
                        <i class="fas fa-heart" style="margin-right: 6px"></i>
                        Support Us
                    </a>
                </span>
            </div>


        </header>
        <main>
            <div id="container">
                <video controls crossorigin playsinline id="player">
                    <source src="{{ video_url }}" type="video/mp4">
                    <track kind="captions" label="{{ language_label }}" srclang="{{ language_code }}"
                        src="{{ captions_url }}" default>
                </video>
            </div>
            <ul>
                <li class="plyr__cite plyr__cite--video">
                    <small>
                        <a href="{{ original_video_url }}" target="_blank" class="link">Original video</a>
                    </small>
                </li>

        </main>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        const controls = [
            'play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
        ];

        const player = new Plyr('#player', {
            controls,
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
            captions: { active: true, update: false, language: '{{ language_code }}' }
            //previewThumbnails: { enabled: true, src: 'https://d1144ayudkrvmu.cloudfront.net/thumbnails.vtt' }
        });
    </script>
