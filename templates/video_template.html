{% extends "base.html" %}

{% block extra_head %}

<link rel="preload" href="https://cdn.plyr.io/3.7.8/plyr.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
<noscript>
    <link href="https://cdn.plyr.io/3.7.8/plyr.css" rel="stylesheet">
</noscript>
<link rel="stylesheet" href="/static/video.css" />

{% endblock %}

{% block content %}
<main>
    <div class="video-page-container">
        <h2>Watch Your Video</h2>
        <p>Enjoy automatically generated or translated subtitles powered by Captionyx.</p>

        <div class="cta-buttons">
            <a href="{{ captions_url }}" target="_blank" class="button">
                <i class="fas fa-download" style="margin-right: 6px;"></i>
                Download Subtitles
            </a>
            <a href="https://buymeacoffee.com/subtitlesgeneratorbot" target="_blank" class="button support-button">
                <i class="fas fa-heart" style="margin-right: 6px;"></i>
                Support Us
            </a>
        </div>

        <div class="video-wrapper">
            <video controls crossorigin playsinline id="player">
                <source src="{{ video_url }}" type="video/mp4">
                <track kind="captions" label="{{ language_label }}" srclang="{{ language_code }}"
                    src="{{ captions_url }}" default>
            </video>
        </div>

        <p class="original-video-link">
            <small>
                <a href="{{ original_video_url }}" target="_blank" class="link">
                    Original Video
                </a>
            </small>
        </p>
    </div>
</main>

{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
    const controls = [
        'play-large', 'play', 'progress', 'current-time',
        'mute', 'volume', 'captions', 'settings',
        'pip', 'airplay', 'fullscreen'
    ];

    const player = new Plyr('#player', {
        controls,
        speed: {
            selected: 1,
            options: [0.5, 0.75, 1, 1.25, 1.5, 2]
        },
        captions: {
            active: true,
            update: false,
            language: '{{ language_code }}'
        }
    });
</script>
{% endblock %}
